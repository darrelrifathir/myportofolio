{% extends 'base.html' %}

{% block content %}
<main>
    <section class="experience-section">
        <div class="container">
            <h1>Edit Pengalaman</h1>
            <form method="post" class="certification-form">
                {% csrf_token %}
                {% for field in form %}
                    <div class="form-group">
                        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                        {{ field }}
                        {% for error in field.errors %}
                            <p class="form-error">{{ error }}</p>
                        {% endfor %}
                    </div>
                {% endfor %}
                <div class="project-form-modal__actions">
                    <a href="{% url 'main:show_experience' %}" class="button button-secondary">Batal</a>
                    <button type="submit" class="button">Simpan Perubahan</button>
                </div>
            </form>
        </div>
    </section>
</main>
{% endblock content %}
